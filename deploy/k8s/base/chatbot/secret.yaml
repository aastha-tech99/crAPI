apiVersion: v1
kind: Secret
metadata:
  name: crapi-chatbot-secret
  labels:
    app: crapi-chatbot
type: Opaque
# IMPORTANT: These placeholder values must be replaced with real credentials
# managed via a secrets manager. The original credentials that were previously
# stored here in plaintext have been removed and must be rotated, as they
# remain in git history.
stringData:
  DB_PASSWORD: "REPLACE_WITH_ACTUAL_DB_PASSWORD"
  MONGO_DB_PASSWORD: "REPLACE_WITH_ACTUAL_MONGO_DB_PASSWORD"
  API_PASSWORD: "REPLACE_WITH_ACTUAL_API_PASSWORD"
