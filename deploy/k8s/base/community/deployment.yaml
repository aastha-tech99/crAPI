apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi-community
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi-community
  template:
    metadata:
      labels:
        app: crapi-community
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: wait-for-postgres
          image: groundnuty/k8s-wait-for:v1.3
          imagePullPolicy: Always
          args:
            - "service"
            - "postgresdb"
          resources:
            limits:
              cpu: "50m"
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
        - name: wait-for-mongo
          image: groundnuty/k8s-wait-for:v1.3
          imagePullPolicy: Always
          args:
            - "service"
            - "mongodb"
          resources:
            limits:
              cpu: "50m"
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
        - name: wait-for-identity
          image: groundnuty/k8s-wait-for:v1.3
          imagePullPolicy: Always
          args:
            - "service"
            - "crapi-identity"
          resources:
            limits:
              cpu: "50m"
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
      containers:
      - name: crapi-community
        image: crapi/crapi-community:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8087
        envFrom:
            - configMapRef:
                name: crapi-community-configmap
        resources:
          limits:
            cpu: "500m"
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
