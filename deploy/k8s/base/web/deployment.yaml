apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi-web
  template:
    metadata:
      labels:
        app: crapi-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: crapi-web
        image: crapi/crapi-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        envFrom:
          - configMapRef:
              name: crapi-web-configmap