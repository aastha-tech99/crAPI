apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi-identity
  template:
    metadata:
      labels:
        app: crapi-identity
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: wait-for-postgres
          image: groundnuty/k8s-wait-for:v1.3
          imagePullPolicy: Always
          args:
            - "service"
            - "postgresdb"
          resources:
            limits:
              cpu: "50m"
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
      volumes:
        - name: jwt-key-secret
          secret:
            secretName: jwt-key-secret
      containers:
        - name: crapi-identity
          image: crapi/crapi-identity:latest
          volumeMounts:
            - mountPath: "/.keys"
              name: jwt-key-secret
              readOnly: true
          imagePullPolicy: Always
          ports:
          - containerPort: 8080
          envFrom:
              - configMapRef:
                  name: crapi-identity-configmap
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

