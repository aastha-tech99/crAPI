apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mailhog.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
    {{- with .Values.mailhog.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.mailhog.deploymentSelectorMatchLabels | nindent 6 }}
  replicas: {{ .Values.mailhog.replicaCount }}
  minReadySeconds: {{ .Values.mailhog.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.mailhog.progressDeadlineSeconds }}
  template:
    metadata:
      labels:
        release: {{ .Release.Name }}
        {{- with .Values.mailhog.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml .Values.mailhog.podAnnotations | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: {{ .Values.mailhog.name }}
          image: {{ .Values.mailhog.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mailhog.smtpPort }}
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mailhog.smtpPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          ports:
          - containerPort: {{ .Values.mailhog.webPort }}
            name: web
            protocol: TCP
          - containerPort: {{ .Values.mailhog.smtpPort }}
            name: smtp
            protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Values.mailhog.config.name }}
          resources:
            limits:
              cpu: {{ .Values.mailhog.resources.limits.cpu | default "200m" | quote }}
              memory: {{ .Values.mailhog.resources.limits.memory | default "256Mi" | quote }}
            requests:
              cpu: {{ .Values.mailhog.resources.requests.cpu | default "50m" | quote }}
              memory: {{ .Values.mailhog.resources.requests.memory | default "64Mi" | quote }}
