apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.web.name }}
  labels:
    release: {{ .Release.Name }}
    {{- toYaml .Values.web.deploymentLabels | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- with .Values.web.deploymentSelectorMatchLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      labels:
        release: {{ .Release.Name }}
        {{- toYaml .Values.web.podLabels | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ .Values.web.name }}
          image: {{ .Values.web.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 443
            - containerPort: 80
          resources:
            limits:
              cpu: {{ .Values.web.resources.limits.cpu | default "200m" | quote }}
              memory: {{ .Values.web.resources.limits.memory | default "256Mi" | quote }}
            requests:
              cpu: {{ .Values.web.resources.requests.cpu | default "50m" | quote }}
              memory: {{ .Values.web.resources.requests.memory | default "64Mi" | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.web.config.name }}
