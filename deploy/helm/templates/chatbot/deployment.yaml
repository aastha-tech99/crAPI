apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.chatbot.name }}
  labels:
    release: {{ .Release.Name }}
    {{- with .Values.chatbot.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.chatbot.replicaCount }}
  selector:
    matchLabels:
      {{- toYaml .Values.chatbot.deploymentSelectorMatchLabels | nindent 6 }}
  template:
    metadata:
      labels:
        release: {{ .Release.Name }}
        {{- with .Values.chatbot.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.waitForK8sResources.image }}
          imagePullPolicy: {{ .Values.waitForK8sResources.imagePullPolicy }}
          args:
            - "service"
            - {{ .Values.postgresdb.service.name | quote }}
        - name: wait-for-mongo
          image: {{ .Values.waitForK8sResources.image }}
          imagePullPolicy: {{ .Values.waitForK8sResources.imagePullPolicy }}
          args:
            - "service"
            - {{ .Values.mongodb.service.name | quote }}
        - name: wait-for-identity
          image: {{ .Values.waitForK8sResources.image }}
          imagePullPolicy: {{ .Values.waitForK8sResources.imagePullPolicy }}
          args:
            - "service"
            - {{ .Values.identity.service.name | quote }}
        - name: wait-for-chromadb
          image: {{ .Values.waitForK8sResources.image }}
          imagePullPolicy: {{ .Values.waitForK8sResources.imagePullPolicy }}
          args:
            - "service"
            - {{ .Values.chromadb.service.name | quote }}
      containers:
        - name: {{ .Values.chatbot.name }}
          image: {{ .Values.chatbot.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.chatbot.port }}
            - containerPort: {{ .Values.chatbot.mcpPort }}
          envFrom:
            - configMapRef:
                name: {{ .Values.chatbot.config.name }}
          resources:
            limits:
              cpu: {{ .Values.chatbot.resources.limits.cpu | default "500m" | quote }}
              memory: {{ .Values.chatbot.resources.limits.memory | default "512Mi" | quote }}
            requests:
              cpu: {{ .Values.chatbot.resources.requests.cpu | default "100m" | quote }}
              memory: {{ .Values.chatbot.resources.requests.memory | default "128Mi" | quote }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.chatbot.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
