{{ if .Values.apiGatewayServiceInstall }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.apiGatewayService.name }}
  labels:
    release: {{ .Release.Name }}
    {{- with .Values.apiGatewayService.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.apiGatewayService.replicaCount }}
  selector:
    matchLabels:
      {{- toYaml .Values.apiGatewayService.deploymentSelectorMatchLabels | nindent 6 }}
  template:
    metadata:
      labels:
        release: {{ .Release.Name }}
        {{- with .Values.apiGatewayService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ .Values.apiGatewayService.name }}
          image: {{ .Values.apiGatewayService.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGatewayService.port }}
          resources:
            limits:
              cpu: {{ .Values.apiGatewayService.resources.limits.cpu | default "500m" | quote }}
              memory: {{ .Values.apiGatewayService.resources.limits.memory | default "512Mi" | quote }}
            requests:
              cpu: {{ .Values.apiGatewayService.resources.requests.cpu | default "100m" | quote }}
              memory: {{ .Values.apiGatewayService.resources.requests.memory | default "128Mi" | quote }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.apiGatewayService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
{{ end }}