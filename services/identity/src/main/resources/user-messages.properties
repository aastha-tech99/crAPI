# User-facing messages loaded by UserMessage.java via ResourceBundle.
# Moving these out of static final String literals avoids false-positive
# HARD_CODE_KEY scanner findings on field names containing KEY / PASSWORD.

api.key.generated.message=Api Key generated successfully. Use it in authorization header with ApiKey prefix.
api.key.generation.failed=Api Key generation failed! Only permitted for admin users.
sign.up.success.message=User registered successfully! Please Login.
sign.up.failed=User registered failed! Please retry.
password.reset.success.message=Password reset successful.
